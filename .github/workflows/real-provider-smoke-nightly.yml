name: Real Provider Smoke Nightly

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-provider-smoke-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-provider-smoke:
    runs-on:
      - self-hosted
      - runoff-real-smoke
    timeout-minutes: 90
    env:
      RUNOFF_RUN_REAL_PROVIDER_SMOKE: "1"
      RUNOFF_REAL_CODEX_ARGV_JSON: ${{ secrets.RUNOFF_REAL_CODEX_ARGV_JSON }}
      RUNOFF_REAL_GEMINI_ARGV_JSON: ${{ secrets.RUNOFF_REAL_GEMINI_ARGV_JSON }}
      RUNOFF_REAL_TIMEOUT_MS: ${{ vars.RUNOFF_REAL_TIMEOUT_MS || '600000' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      REAL_PROVIDER_SMOKE_REPORT_DIR: tmp/real-provider-smoke/nightly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required CLI agents
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNOFF_REAL_CODEX_ARGV_JSON:?missing secret RUNOFF_REAL_CODEX_ARGV_JSON}"
          : "${RUNOFF_REAL_GEMINI_ARGV_JSON:?missing secret RUNOFF_REAL_GEMINI_ARGV_JSON}"
          command -v codex
          command -v gemini
          codex --version
          gemini --version

      - name: Run real provider smoke
        run: npm run smoke:real:nightly -- --report-dir "$REAL_PROVIDER_SMOKE_REPORT_DIR"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-provider-smoke-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REAL_PROVIDER_SMOKE_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 14

      - name: Print summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$REAL_PROVIDER_SMOKE_REPORT_DIR/summary.md" ]]; then
            cat "$REAL_PROVIDER_SMOKE_REPORT_DIR/summary.md"
          fi
