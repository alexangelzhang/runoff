name: Release

# Tag releases require green CI gates + pre-release real-provider smoke (self-hosted runner).
# Configure repo secrets: LLM_PIPELINE_REAL_CODEX_ARGV_JSON, LLM_PIPELINE_REAL_GEMINI_ARGV_JSON
# Runner labels: self-hosted, llm-pipeline-real-smoke

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci:gates

  pre-release-smoke:
    needs: gates
    uses: ./.github/workflows/real-provider-smoke-pre-release.yml
    secrets: inherit

  release:
    needs: [gates, pre-release-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md
          name: v${{ steps.ver.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
