# PR: required job = `gates`. Optional `smoke` until self-hosted runner + secrets (see docs/operations/ci-branch-protection.md).
name: CI Gates

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLM_PIPELINE_HOME: ${{ runner.temp }}/llm-pipeline-ci-home
      TMPDIR: ${{ runner.temp }}/llm-pipeline-tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated pipeline home
        run: mkdir -p "$LLM_PIPELINE_HOME" "$TMPDIR"

      - name: Run CI gates (ipc + gate2 + gate3 + unit tests)
        run: npm run ci:gates

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: PR smoke gate
        env:
          HAS_REAL_SMOKE_SECRETS: ${{ secrets.LLM_PIPELINE_REAL_CODEX_ARGV_JSON != '' }}
        run: |
          if [ "$HAS_REAL_SMOKE_SECRETS" = "true" ]; then
            echo "Secrets present — run strict smoke (no allow-skip). Requires codex/gemini on runner PATH."
            npm run ci:gates:smoke:strict
          else
            echo "No real-provider secrets — smoke runs with allow-skip."
            npm run ci:gates:smoke
          fi
